version: '3.8'

services:
  tggift-bot:
    build: .
    container_name: tggift-bot
    restart: unless-stopped
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - API_ID=${API_ID}
      - API_HASH=${API_HASH}
      - PHONE_NUMBER=${PHONE_NUMBER}
      - DATABASE_PATH=/app/data/gift_bot.db
      - LOG_FILE=/app/logs/bot.log
      - LOG_LEVEL=INFO
      - MONITORING_INTERVAL=60
      - MAX_QUEUE_SIZE=1000
      - NOTIFICATIONS_ENABLED=true
      - HEALTH_CHECK_ENABLED=true
      - ENABLE_RATE_LIMITING=true
      # Пользовательские аккаунты
      - USER_API_ID=${USER_API_ID}
      - USER_API_HASH=${USER_API_HASH}
      - USER_SESSIONS_DIR=/app/user_sessions
      - SESSION_ENC_KEY=${SESSION_ENC_KEY}
      # PostgreSQL настройки
      - USE_POSTGRES=true
      - POSTGRES_HOST=tggift-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=tggift
      - POSTGRES_USER=tggift
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-tggift_password}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./user_sessions:/app/user_sessions
      - ./.env:/app/.env:ro
    networks:
      - tggift-network
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "python", "-c", "import sqlite3; sqlite3.connect('/app/data/gift_bot.db')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  postgres:
    image: postgres:15-alpine
    container_name: tggift-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=tggift
      - POSTGRES_USER=tggift
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-tggift_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - tggift-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tggift -d tggift"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: tggift-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - tggift-network
    depends_on:
      - tggift-bot

volumes:
  postgres_data:

networks:
  tggift-network:
    driver: bridge 
<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 820 700">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <style>
      .room { fill:#f7f7f7; stroke:#333; stroke-width:2; }
      .desk { fill:#dcdcff; stroke:#333; stroke-width:1.5; }
      .pc { fill:#ffe0cc; stroke:#333; stroke-width:1.5; }
      .clearance { fill:#e8f5e9; stroke:#2e7d32; stroke-width:1; stroke-dasharray:6 4; opacity:0.7; }
      .monitor5090 { fill:#c7f5d9; stroke:#2e7d32; stroke-width:1; }
      .monitor6000 { fill:#cce5ff; stroke:#1e3a8a; stroke-width:1; }
      .dim { stroke:#333; stroke-width:1; marker-start:url(#arrow); marker-end:url(#arrow); }
      .dimText { font: 12px sans-serif; fill:#333; }
      .label { font: 13px sans-serif; fill:#111; }
      .legend { font: 12px sans-serif; fill:#111; }
    </style>
  </defs>

  <!-- Scale note -->
  <text x="50" y="28" class="label">Масштаб: 1 мм = 0.2 px (комната 3.6 м × 3.0 м)</text>

  <!-- Room -->
  <rect x="50" y="50" width="720" height="600" class="room"/>
  <text x="410" y="45" class="label" text-anchor="middle">Комната 3600 × 3000 мм (рекомендовано)</text>

  <!-- Desk (2400 × 900 мм) -->
  <rect x="170" y="470" width="480" height="180" rx="4" class="desk"/>
  <text x="410" y="665" class="label" text-anchor="middle">Стол 2400 × 900 мм, высота 750 мм</text>

  <!-- Chair clearance 1200 мм -->
  <rect x="170" y="230" width="480" height="240" class="clearance"/>
  <text x="410" y="250" class="label" text-anchor="middle">Зона движения кресла ≥ 1200 мм</text>

  <!-- PC case (7000D тип, 550×280 мм footprint) с зазорами -->
  <rect x="670" y="520" width="56" height="110" rx="2" class="pc"/>
  <text x="698" y="510" class="label" text-anchor="middle">ПК корпус
(≈550×280 мм)</text>
  <!-- Clearance zones around PC (100–150 мм) -->
  <rect x="660" y="510" width="76" height="130" fill="none" stroke="#ff9800" stroke-dasharray="6 4"/>
  <text x="698" y="655" class="label" text-anchor="middle">Зазоры 100–150 мм</text>

  <!-- Monitors on desk (top view footprints) -->
  <!-- Bottom row: 27" (5090, слева), 34" UW (6000, центр), 27" (5090, справа) -->
  <rect x="190" y="505" width="122" height="48" class="monitor5090"/>
  <rect x="329" y="495" width="162" height="50" class="monitor6000"/>
  <rect x="508" y="505" width="122" height="48" class="monitor5090"/>
  <!-- Top row: три 27" (6000) -->
  <rect x="200" y="560" width="122" height="44" class="monitor6000"/>
  <rect x="349" y="555" width="122" height="44" class="monitor6000"/>
  <rect x="498" y="560" width="122" height="44" class="monitor6000"/>

  <!-- Legends for monitors -->
  <text x="251" y="535" class="legend" text-anchor="middle">27" ← 5090 (игры/медиа)</text>
  <text x="410" y="490" class="legend" text-anchor="middle">34" UW ← 6000 (IDE/графики)</text>
  <text x="569" y="535" class="legend" text-anchor="middle">27" → 5090 (игры/VR)</text>
  <text x="410" y="615" class="legend" text-anchor="middle">Верхний ряд 3×27" → 6000 (код/логи/видео)</text>

  <!-- Dimension lines room -->
  <line x1="50" y1="20" x2="770" y2="20" class="dim"/>
  <text x="410" y="15" class="dimText" text-anchor="middle">3600 мм</text>
  <line x1="30" y1="50" x2="30" y2="650" class="dim"/>
  <text x="18" y="355" class="dimText" transform="rotate(-90 18,355)">3000 мм</text>

  <!-- Dimension lines desk -->
  <line x1="170" y1="460" x2="650" y2="460" class="dim"/>
  <text x="410" y="455" class="dimText" text-anchor="middle">2400 мм (ширина стола)</text>
  <line x1="660" y1="470" x2="660" y2="650" class="dim"/>
  <text x="665" y="565" class="dimText" transform="rotate(-90 665,565)">900 мм (глубина стола)</text>

  <!-- Legend box -->
  <rect x="60" y="60" width="220" height="110" fill="#fff" stroke="#333" stroke-width="1"/>
  <rect x="70" y="78" width="16" height="12" class="monitor5090"/>
  <text x="92" y="88" class="legend">Мониторы 5090: игры/FG/медиа</text>
  <rect x="70" y="100" width="16" height="12" class="monitor6000"/>
  <text x="92" y="110" class="legend">Мониторы 6000: IDE/графики/логи</text>
  <rect x="70" y="122" width="16" height="12" class="pc"/>
  <text x="92" y="132" class="legend">Корпус ПК (3×GPU)</text>
</svg>
